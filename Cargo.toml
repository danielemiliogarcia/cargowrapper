[package]
name = "cargowrapper"
version = "0.2.3"
rust-version = "1.85"
edition = "2024"
license = "MIT"
description = "Cargo wrapper that enforces locked builds and hosts middleware plugins"
repository = "https://github.com/danielemiliogarcia/cargowrapper"

[dependencies]

# The profile used for reproducible release artifacts generated by dist.
[profile.dist]
inherits = "release"
lto = "thin"
