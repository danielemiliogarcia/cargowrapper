name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal -c rustfmt,clippy
      - run: cargo +1.100.0 fmt --all --check
      - run: cargo +1.100.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.100.0 test --all-targets --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked
